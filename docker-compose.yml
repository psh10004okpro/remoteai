services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "18790"
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.6}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    volumes:
      - remoteai-data:/data
    ports:
      - "18790:18790"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18790/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  remoteai-data:
