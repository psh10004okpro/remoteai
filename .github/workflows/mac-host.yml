name: mac-host

on:
  push:
    branches: [main]
    paths:
      - 'apps/host/**'
      - 'packages/protocol/**'
      - 'scripts/pack-host-mac.mjs'
      - '.github/workflows/mac-host.yml'
  workflow_dispatch:

jobs:
  pack:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @remoteai/protocol
      - run: npm run build -w @remoteai/host
      - run: node scripts/pack-host-mac.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteAI-Mac
          path: dist/RemoteAI-Mac.zip
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --title "RemoteAI 0.1.0" --notes "host builds"
          gh release upload v0.1.0 dist/RemoteAI-Mac.zip --clobber
