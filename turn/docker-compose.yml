services:
  coturn:
    image: coturn/coturn:4.7
    restart: unless-stopped
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USER:-remoteai}:${TURN_PASS:?set TURN_PASS}
      - --realm=remoteai
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-rfc5780
      - --listening-ip=0.0.0.0
